<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HotelDO – Promociones Octubre 2026 (W43)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",sans-serif;background:#F2F5FA;color:#1A2B45}
header{background:#1B365D}
.hdr-top{background:#1B365D;display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-img{height:72px;width:auto;display:block}
.hdr-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:.75rem;font-weight:700;padding:8px 18px;border-radius:20px;letter-spacing:.07em;text-transform:uppercase}
.btn-pdf{display:flex;align-items:center;gap:8px;background:#E8890A;color:#fff;border:none;border-radius:10px;padding:11px 22px;font-size:.86rem;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 3px 12px rgba(232,137,10,.4)}
.btn-pdf:hover{background:#F5A030;transform:translateY(-1px)}
.btn-pdf svg{width:16px;height:16px;flex-shrink:0}
.hdr-hero{background:#1B365D;text-align:center;padding:36px 48px 44px;position:relative;overflow:hidden}
.hdr-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px}
.hdr-hero h1{font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:900;color:#fff;letter-spacing:-.02em;line-height:1.1;position:relative;z-index:1}
.hdr-hero h1 span{color:#E8890A}
.hdr-hero p{color:rgba(255,255,255,.7);margin-top:10px;font-size:1rem;position:relative;z-index:1}
.stats{display:flex;justify-content:center;flex-wrap:wrap;margin-top:28px;position:relative;z-index:1}
.stat{text-align:center;padding:12px 34px;border-right:1px solid rgba(255,255,255,.1)}
.stat:last-child{border:none}
.stat b{display:block;font-size:2.1rem;font-weight:900;color:#E8890A;line-height:1}
.stat small{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.6)}
.main-nav{background:#1B365D;display:flex;justify-content:center;padding:0 20px;border-bottom:3px solid #E8890A}
.tab{background:none;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.45);font-size:.95rem;font-weight:700;padding:16px 36px;cursor:pointer;transition:.2s;margin-bottom:-3px;white-space:nowrap}
.tab:hover{color:rgba(255,255,255,.85)}
.tab.on{color:#E8890A;border-bottom-color:#E8890A}
main{max-width:1440px;margin:0 auto;padding:28px 18px 64px}
.page{display:none}.page.on{display:block}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.si{position:relative;flex:1;min-width:220px}
.si input{width:100%;padding:11px 16px 11px 44px;border:1.5px solid #D4DCE8;border-radius:10px;font-size:.93rem;outline:none;background:#fff}
.si input:focus{border-color:#E8890A;box-shadow:0 0 0 3px rgba(232,137,10,.12)}
.si::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:.9rem}
.bar select{padding:11px 14px;border:1.5px solid #D4DCE8;border-radius:10px;font-size:.88rem;background:#fff;outline:none;font-weight:600;cursor:pointer}
.bar select:focus{border-color:#E8890A}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.fb{padding:6px 15px;border-radius:18px;border:1.5px solid #D4DCE8;background:#fff;font-size:.78rem;font-weight:700;cursor:pointer;transition:.2s;color:#1A2B45}
.fb:hover{border-color:#E8890A;color:#E8890A}
.fb.on{background:#E8890A;color:#fff;border-color:#E8890A}
.all-btn{background:#1B365D;color:#fff;border-color:#1B365D}
.all-btn.on{background:#1B365D;border-color:#1B365D;color:#fff}
.count{font-size:.8rem;color:#6B7E99;margin-bottom:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;box-shadow:0 3px 18px rgba(23,46,78,.09);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 36px rgba(23,46,78,.16)}
.ch{background:#1B365D;padding:17px 18px 14px;position:relative;min-height:98px}
.ch::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#E8890A,#F5A030)}
.dbadge{position:absolute;top:13px;right:13px;width:60px;height:60px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.dbadge .p{font-size:1.25rem;font-weight:900;color:#fff;line-height:1}
.dbadge .o{font-size:.54rem;font-weight:800;color:#fff;letter-spacing:.05em}
.bg-r{background:#1A9E6E}.bg-o{background:#E8890A}.bg-a{background:#D96A15}.bg-g{background:#C0687E}
.cd{font-size:.67rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#F5A030;margin-bottom:5px}
.hn{font-size:.91rem;font-weight:700;color:#fff;line-height:1.35;padding-right:72px}
.cc{font-size:.72rem;color:rgba(255,255,255,.55);margin-top:5px}
.cb{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:8px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.di{background:#F2F5FA;border-radius:8px;padding:9px 11px;border:1px solid #D4DCE8}
.di .dl{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:#6B7E99;font-weight:800;margin-bottom:3px}
.di .dv{font-size:.78rem;font-weight:700;color:#1B365D}
.chain-subnav{background:#fff;border-radius:14px;box-shadow:0 3px 18px rgba(23,46,78,.09);margin-bottom:22px;padding:0 16px;display:flex;flex-wrap:wrap;border-bottom:2px solid #E8890A}
.chain-subnav .tab{color:#1A2B45;border-bottom:3px solid transparent;padding:14px 22px;font-size:.88rem;font-weight:700;margin-bottom:-2px}
.chain-subnav .tab:hover{color:#E8890A}
.chain-subnav .tab.on{color:#E8890A;border-bottom-color:#E8890A}
.chain-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:18px 24px;background:#fff;border-radius:14px;box-shadow:0 3px 18px rgba(23,46,78,.09);border-left:5px solid #E8890A}
.chain-header h2{font-size:1.3rem;font-weight:900;color:#1B365D}
.pill{background:#E8890A;color:#fff;font-size:.72rem;font-weight:700;padding:3px 12px;border-radius:11px}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.dc{background:#fff;border-radius:14px;box-shadow:0 3px 18px rgba(23,46,78,.09);display:flex;transition:transform .2s}
.dc:hover{transform:translateY(-3px)}
.ds{width:5px;flex-shrink:0;background:linear-gradient(to bottom,#E8890A,#1B365D);border-radius:14px 0 0 14px}
.db{padding:16px 14px;flex:1}
.dd{font-size:.67rem;text-transform:uppercase;letter-spacing:.08em;color:#E8890A;font-weight:800;margin-bottom:4px}
.dn{font-size:.9rem;font-weight:700;color:#1B365D;line-height:1.3;margin-bottom:6px}
.ddsc{font-size:.85rem;font-weight:900;color:#1A9E6E;margin-bottom:6px}
.ddate{font-size:.67rem;color:#6B7E99;margin-top:2px;line-height:1.5}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#6B7E99}
footer{background:#1B365D;padding:22px 48px;margin-top:40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.flogo{height:44px;display:block}
footer p{color:rgba(255,255,255,.4);font-size:.76rem}
@media(max-width:700px){
  .hdr-top{padding:12px 16px}.logo-img{height:52px}
  .hdr-hero{padding:22px 16px 28px}.hdr-hero h1{font-size:1.7rem}
  .stat{padding:10px 16px}
  .tab{padding:12px 18px;font-size:.82rem}
  .dates{grid-template-columns:1fr}
  footer{padding:16px 20px}
  .chain-subnav .tab{padding:11px 14px;font-size:.8rem}
}
</style>
</head>

let activeChain = CHAIN_NAMES[0] || '';
let filt = 'ALL';

function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.main-nav .tab').forEach(t => t.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if (btn) btn.classList.add('on');
  if (id === 'cadenas') renderChains(activeChain);
}

function showChain(name, btn) {
  activeChain = name;
  document.querySelectorAll('.chain-subnav .tab').forEach(t => t.classList.remove('on'));
  if (btn) btn.classList.add('on');
  renderChains(name);
}

function setF(btn) {
  filt = btn.dataset.f;
  document.querySelectorAll('.filters .fb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function bgc(d) {
  return d >= 50 ? 'bg-r' : d >= 35 ? 'bg-o' : d >= 20 ? 'bg-a' : 'bg-g';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const q   = (document.getElementById('q').value || '').toLowerCase();
  const ord = document.getElementById('ord').value;
  let rows  = DATA.filter(r =>
    (filt === 'ALL' || r.Pais === filt) &&
    (!q || r.Destino.toLowerCase().includes(q) || r.Hotel.toLowerCase().includes(q) || r.Cadena.toLowerCase().includes(q))
  );
  rows.sort((a,b) => {
    if (ord === 'da') return b.Desc - a.Desc;
    if (ord === 'dd') return a.Desc - b.Desc;
    if (ord === 'pa') return a.Destino.localeCompare(b.Destino);
    return a.Hotel.localeCompare(b.Hotel);
  });
  const n = rows.length;
  document.getElementById('cnt').textContent =
    n === 1 ? '1 promoci\u00f3n encontrada' : n + ' promociones encontradas';
  if (!n) {
    document.getElementById('grid').innerHTML = '<div class="empty"><p>Sin resultados.</p></div>';
    return;
  }
  document.getElementById('grid').innerHTML = rows.map(r =>
    '<div class="card">' +
      '<div class="ch">' +
        '<div class="dbadge ' + bgc(r.Desc) + '">' +
          '<span class="p">' + r.Desc + '%</span><span class="o">OFF</span>' +
        '</div>' +
        '<div class="cd">\uD83D\uDCCD ' + esc(r.Destino) + '</div>' +
        '<div class="hn">' + esc(r.Hotel || '\u2014') + '</div>' +
        (r.Cadena ? '<div class="cc">\uD83C\uDFE0 ' + esc(r.Cadena) + '</div>' : '') +
      '</div>' +
      '<div class="cb">' +
        '<div class="dates">' +
          '<div class="di"><div class="dl">\uD83D\uDCC5 Booking Window</div><div class="dv">' + esc(r.BW || '\u2014') + '</div></div>' +
          '<div class="di"><div class="dl">\u2708\uFE0F Travel Window</div><div class="dv">' + esc(r.TW || '\u2014') + '</div></div>' +
        '</div>' +
      '</div>' +
    '</div>'
  ).join('');
}

function renderChains(name) {
  if (!name) return;
  const records = (CHAINS[name] || []).slice().sort((a,b) => b.Desc - a.Desc);
  const n = records.length;
  let html = '<div class="chain-header"><h2>\u2605 ' + esc(name) + '</h2>' +
    '<span class="pill">' + n + ' propiedad' + (n === 1 ? '' : 'es') + '</span></div>';
  html += '<div class="dg">';
  if (!n) {
    html += '<div class="empty"><p>Sin datos.</p></div>';
  } else {
    html += records.map(r =>
      '<div class="dc">' +
        '<div class="ds"></div>' +
        '<div class="db">' +
          '<div class="dd">\uD83D\uDCCD ' + esc(r.Destino) + '</div>' +
          '<div class="dn">' + esc(r.Hotel) + '</div>' +
          '<div class="ddsc">' + r.Desc + '% OFF</div>' +
          '<div class="ddate">\uD83D\uDCC5 ' + esc(r.BW) + '</div>' +
          '<div class="ddate">\u2708\uFE0F ' + esc(r.TW) + '</div>' +
        '</div>' +
      '</div>'
    ).join('');
  }
  html += '</div>';
  document.getElementById('chains-container').innerHTML = html;
}

function doPDF() {
  const btn = document.querySelector('.btn-pdf');
  btn.textContent = 'Generando...';
  btn.disabled = true;
  document.querySelectorAll('.page').forEach(p => p.style.display = 'block');
  html2pdf().set({
    margin: 8,
    filename: 'HotelDO_Promociones_W43_Oct2026_v2.pdf',
    image: {type:'jpeg', quality:.92},
    html2canvas: {scale:2, useCORS:true},
    jsPDF: {unit:'mm', format:'a4', orientation:'landscape'}
  }).from(document.body).save().then(() => {
    document.querySelectorAll('.page').forEach(p => p.style.display = '');
    btn.textContent = 'Exportar PDF';
    btn.disabled = false;
  });
}

// Init
render();
if (CHAIN_NAMES.length) {
  const first = document.querySelector('.chain-subnav .tab');
  if (first) first.classList.add('on');
  renderChains(CHAIN_NAMES[0]);
}
